spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/orderdb
spring.datasource.username=retail_app
spring.datasource.password=retail_dev_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.retail.platform.order.event

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

app.kafka.schema-registry-url=http://localhost:8081

spring.devtools.restart.enabled=false

logging.level.com.retail.platform.order=INFO

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=order-service
management.prometheus.metrics.export.enabled=true

# Keycloak JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/retail-platform

# OAuth2 client credentials
spring.security.oauth2.client.registration.inventory-service.provider=keycloak
spring.security.oauth2.client.registration.inventory-service.client-id=order-service-client
spring.security.oauth2.client.registration.inventory-service.client-secret=${ORDER_SERVICE_CLIENT_SECRET:hN97mbC9q2LnrCNxZ3CmAQxBE7osrAW8}
spring.security.oauth2.client.registration.inventory-service.authorization-grant-type=client_credentials

# Keycloak token endpoint
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/retail-platform/protocol/openid-connect/token

inventory.service.base-url=${INVENTORY_SERVICE_URL:http://localhost:8082}

logging.pattern.level=%5p [correlationId=%X{correlationId:-N/A}]


# =====================================
# HTTP Latency Histogram
# =====================================

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s


# Sample all requests for development
management.tracing.sampling.probability=1.0

# Temporarily disable exporting until Tempo is configured
management.otlp.tracing.export.enabled=false
