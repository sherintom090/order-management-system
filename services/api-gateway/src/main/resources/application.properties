spring.application.name=api-gateway
server.port=8083

# Order Service
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ORDER_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/orders/**
# Order Service - Redis rate limiting
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter

spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=2
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=5
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=RateLimitMonitoringFilter

# Order Service Circuit Breaker
spring.cloud.gateway.server.webflux.routes[0].filters[2].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.name=orderServiceCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.fallbackUri=forward:/fallback/orders
spring.cloud.gateway.server.webflux.routes[0].filters[3].name=RequestSize
spring.cloud.gateway.server.webflux.routes[0].filters[3].args.maxSize=2MB

# Inventory Service
spring.cloud.gateway.server.webflux.routes[1].id=inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/inventory/**
# Inventory Service rate limiting
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter

spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=5
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.server.webflux.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[1].name=RateLimitMonitoringFilter

# Inventory Service Circuit Breaker
spring.cloud.gateway.server.webflux.routes[1].filters[2].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.name=inventoryServiceCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.fallbackUri=forward:/fallback/inventory
spring.cloud.gateway.server.webflux.routes[1].filters[3].name=RequestSize
spring.cloud.gateway.server.webflux.routes[1].filters[3].args.maxSize=2MB

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# Dedicated Actuator management server
management.server.port=9090
management.server.address=127.0.0.1

# Keycloak OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/retail-platform}

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Connection timeout
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=2s

# ==========================================
# Order Service Circuit Breaker
# ==========================================

resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.registerHealthIndicator=true

# Inventory Service Circuit Breaker
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.registerHealthIndicator=true

# Default timeouts for downstream services
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

# Order Service route-specific timeouts
spring.cloud.gateway.server.webflux.routes[0].metadata.connect-timeout=2000
spring.cloud.gateway.server.webflux.routes[0].metadata.response-timeout=4000

# Inventory Service route-specific timeouts
spring.cloud.gateway.server.webflux.routes[1].metadata.connect-timeout=2000
spring.cloud.gateway.server.webflux.routes[1].metadata.response-timeout=3000

# Graceful shutdown
server.shutdown=graceful

# Maximum time allowed for active requests to finish
spring.lifecycle.timeout-per-shutdown-phase=30s

# Enable Kubernetes-style health probes
# Expose probe endpoints on the main Gateway port
management.endpoint.health.probes.add-additional-paths=true

# Show only basic health information
management.endpoint.health.show-details=never



# =====================================
# HTTP Latency Histogram
# =====================================

management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s


# Sample all requests for development
management.tracing.sampling.probability=1.0

# Export traces to Grafana Tempo
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces


# Propagate tracing context across Reactor threads
spring.reactor.context-propagation=auto


